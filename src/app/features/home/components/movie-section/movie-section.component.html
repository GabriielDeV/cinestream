<section class="content-section">
  <div class="section-header">
    <h2 class="section-title">{{ title }}</h2>
    <a class="section-see-all" href="#" [attr.aria-label]="'Ver todos em ' + title">Ver tudo</a>
  </div>

  <div class="carousel-wrapper">
    @if (canScroll()) {
      <button
        class="carousel-btn carousel-btn--prev"
        type="button"
        aria-label="Voltar"
        (click)="scrollLeft()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
    }

    <div class="section-scroll-container" #scrollContainer>
      @if (layout === 'ranking') {
        <div class="cards-row cards-row--ranking">
          @for (movie of movies; track movie.id) {
            <app-ranking-card [movie]="movie" (movieSelected)="movieSelected.emit($event)" />
          }
        </div>
      } @else {
        <div
          class="cards-row"
          [class.cards-row--poster]="layout === 'poster'"
          [class.cards-row--landscape]="layout === 'landscape'"
        >
          @for (movie of movies; track movie.id) {
            <app-movie-card [movie]="movie" [layout]="cardLayout" (movieSelected)="movieSelected.emit($event)" />
          }
        </div>
      }
    </div>

    @if (canScroll()) {
      <button
        class="carousel-btn carousel-btn--next"
        type="button"
        aria-label="Avançar"
        (click)="scrollRight()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    }
  </div>
</section>
