<app-site-header (search)="onSearch($event)" (homeSelected)="clearSearch()" />

@if (isLoading()) {
  <div class="page-loading">
    <app-loading />
  </div>
} @else if (error()) {
  <main class="home-main">
    <div class="page-error">
      <app-error-message [message]="error()!" (retry)="onRetry()" />
    </div>
  </main>
} @else {
  <main class="home-main">
    @if (heroMovie() && !isSearchActive()) {
      <app-hero-banner [movie]="heroMovie()!" (watchNow)="onMovieSelected($event)" />
    }

    <div class="sections-container">
      @if (isSearchActive()) {
        <div class="search-results-container">
          <app-search-results
            [query]="searchQuery()"
            [results]="searchResults()"
            [isLoading]="isSearchLoading()"
            [error]="searchError()"
            (contentSelected)="onMovieSelected($event)"
          />
        </div>
      } @else {
        @if (popularMovies().length > 0) {
          <app-movie-section
            title="Melhores filmes"
            [movies]="popularMovies()"
            layout="poster"
            (movieSelected)="onMovieSelected($event)"
          />
        }
        @if (topRatedMovies().length > 0) {
          <app-movie-section
            title="Top 10 no Brasil"
            [movies]="topRatedMovies()"
            layout="ranking"
            (movieSelected)="onMovieSelected($event)"
          />
        }
        @if (upcomingMovies().length > 0) {
          <app-movie-section
            title="Lançamentos"
            [movies]="upcomingMovies()"
            layout="poster"
            (movieSelected)="onMovieSelected($event)"
          />
        }
      }
    </div>
  </main>
}

<app-site-footer />
