<article class="movie-card" [class.movie-card--landscape]="layout === 'landscape'" [class.movie-card--poster]="layout === 'poster'">
  <div class="card-media">
    <img
      class="card-image"
      [src]="movie.posterUrl"
      [alt]="movie.title"
      loading="lazy"
      (error)="onImageError($event)"
    />
    @if (movie.tag) {
      <span class="card-badge">{{ movie.tag }}</span>
    }
    <div class="card-overlay" aria-hidden="true">
      <button class="card-add-btn" type="button" [attr.aria-label]="'Adicionar ' + movie.title + ' à lista'">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>
  <div class="card-info">
    <h3 class="card-title">{{ movie.title }}</h3>
    <span class="card-meta">{{ movie.releaseYear }} · ★ {{ movie.rating }}</span>
  </div>
</article>
