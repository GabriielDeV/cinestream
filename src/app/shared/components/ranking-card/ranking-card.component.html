<article
  class="ranking-card"
  role="button"
  tabindex="0"
  [attr.aria-label]="'Assistir ' + movie.title"
  (click)="onCardClick()"
  (keydown.enter)="onCardClick()"
  (keydown.space)="onCardClick()"
>
  <div class="ranking-number" aria-hidden="true">{{ movie.ranking }}</div>
  <div class="card-media">
    <img
      class="card-image"
      [src]="movie.posterUrl"
      [alt]="movie.title"
      loading="lazy"
      (error)="onImageError($event)"
    />
    <div class="card-overlay" aria-hidden="true">
      <button class="card-play-btn" type="button" [attr.aria-label]="'Assistir ' + movie.title">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </button>
    </div>
  </div>
  <div class="card-info">
    <h3 class="card-title">{{ movie.title }}</h3>
    <span class="card-meta">★ {{ movie.rating }}</span>
  </div>
</article>
