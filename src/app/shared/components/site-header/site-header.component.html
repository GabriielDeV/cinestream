<header class="site-header">
  <div class="header-inner">
    <div class="header-left">
      <a class="logo" [routerLink]="['/']">
        <span class="logo-cine">Cine</span><span class="logo-stream">Stream</span>
      </a>
      <nav class="main-nav" aria-label="Navegação principal">
        <ul class="nav-list">
          @for (item of navItems; track item.path) {
            <li>
              <a
                class="nav-link"
                [routerLink]="item.path"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: item.exactMatch }"
              >{{ item.label }}</a>
            </li>
          }
        </ul>
      </nav>
    </div>

    <div class="header-right">
      @if (isSearchOpen()) {
        <div class="search-container" role="search">
          <input
            #searchInput
            class="search-input"
            type="search"
            placeholder="Buscar filmes e séries..."
            [value]="searchQuery()"
            (input)="onSearchInput($event)"
            (keydown.escape)="closeSearch()"
            aria-label="Buscar filmes e séries"
            autofocus
          />
          <button class="icon-btn" type="button" aria-label="Fechar busca" (click)="closeSearch()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      } @else {
        <button class="icon-btn" type="button" aria-label="Abrir busca" (click)="openSearch()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      }

      <button class="icon-btn" type="button" aria-label="Notificações">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="notification-badge" aria-hidden="true"></span>
      </button>

      <button class="avatar-btn" type="button" aria-label="Perfil do usuário">
        <div class="avatar" aria-hidden="true">CS</div>
      </button>
    </div>
  </div>
</header>
