<section class="hero-banner" [style]="backgroundStyle" aria-label="Conteúdo em destaque">
  <div class="hero-overlay"></div>
  <div class="hero-gradient"></div>

  <div class="hero-content">
    <div class="hero-meta">
      <span class="rating-badge">★ {{ movie.rating }}</span>
      @if (primaryGenre) {
        <span class="genre-tag">{{ genreList }}</span>
      }
      @if (movie.tag) {
        <span class="badge badge--new">{{ movie.tag }}</span>
      }
    </div>

    <h1 class="hero-title">{{ movie.title }}</h1>
    <p class="hero-description">{{ movie.description }}</p>

    @if (movie.releaseYear) {
      <div class="hero-info">
        <span class="hero-year">{{ movie.releaseYear }}</span>
      </div>
    }

    <div class="hero-actions">
      <button class="btn btn--primary" type="button" (click)="onWatchNow()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        Assistir agora
      </button>
      <button class="btn btn--secondary" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Adicionar à lista
      </button>
    </div>
  </div>

  <div class="hero-bottom-fade" aria-hidden="true"></div>
</section>
